name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: npm run test:sw
      - name: Mobile browser smoke test
        env:
          FOOD_BASE: /
          FOOD_COOKIE_SECURE: '0'
          FOOD_DATA: ${{ runner.temp }}/food-diary
        run: |
          python -m waitress --listen=127.0.0.1:8792 app:app >"$RUNNER_TEMP/food-diary.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8792/api/me >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
          npm run test:push
